<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A theater stage with red curtains and performers in a spotlight">
  <!-- Drawn for Broadway Rush (SPEC 2.8 N14 c): the picture for shows without a Ticketmaster photo. Our own drawing, free to use. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241240"/><stop offset="1" stop-color="#3d2160"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset=".55" stop-color="#ffc94d" stop-opacity=".14"/><stop offset="1" stop-color="#ffc94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c4" stop-opacity=".5"/><stop offset="1" stop-color="#ffd25a" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="velvetL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c0a24"/><stop offset=".18" stop-color="#a81d3c"/><stop offset=".34" stop-color="#6a0f2a"/>
      <stop offset=".52" stop-color="#bb2646"/><stop offset=".7" stop-color="#701130"/><stop offset=".86" stop-color="#b52241"/><stop offset="1" stop-color="#5e0b26"/>
    </linearGradient>
    <linearGradient id="velvetR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5c0a24"/><stop offset=".18" stop-color="#a81d3c"/><stop offset=".34" stop-color="#6a0f2a"/>
      <stop offset=".52" stop-color="#bb2646"/><stop offset=".7" stop-color="#701130"/><stop offset=".86" stop-color="#b52241"/><stop offset="1" stop-color="#5e0b26"/>
    </linearGradient>
    <linearGradient id="valance" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1230"/><stop offset="1" stop-color="#a51f3d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6631"/><stop offset="1" stop-color="#5b351a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9962a"/>
    </linearGradient>
  </defs>

  <!-- Back wall and the warm glow on stage -->
  <rect width="320" height="180" fill="url(#back)"/>
  <rect width="320" height="180" fill="url(#glow)"/>

  <!-- Floor: planks in perspective -->
  <path d="M0 136 H320 V180 H0 Z" fill="url(#floor)"/>
  <g stroke="#4a2a12" stroke-opacity=".55" stroke-width=".8">
    <path d="M160 136 L160 180"/><path d="M130 136 L112 180"/><path d="M100 136 L64 180"/><path d="M70 136 L16 180"/>
    <path d="M190 136 L208 180"/><path d="M220 136 L256 180"/><path d="M250 136 L304 180"/>
    <path d="M0 152 H320" stroke-opacity=".3"/><path d="M0 166 H320" stroke-opacity=".25"/>
  </g>
  <ellipse cx="160" cy="146" rx="70" ry="9" fill="#ffe7a6" fill-opacity=".35"/>

  <!-- Spotlight beam -->
  <path d="M146 0 H174 L222 146 H98 Z" fill="url(#beam)"/>

  <!-- Performers: two at the sides, one in the middle with arms up (the big finish) -->
  <g fill="#1c0e33" transform="translate(0 -6)">
    <circle cx="112" cy="98" r="6.5"/>
    <path d="M104 108 Q112 104 120 108 L123 130 L117 130 L115 142 L110 142 L108 130 L101 130 Z"/>
    <circle cx="208" cy="98" r="6.5"/>
    <path d="M200 108 Q208 104 216 108 L219 130 L213 130 L211 142 L206 142 L204 130 L197 130 Z"/>
    <circle cx="160" cy="88" r="7.5"/>
    <path d="M150 100 Q160 95 170 100 L176 126 L168 126 L166 143 L161 143 L160 128 L159 143 L154 143 L152 126 L144 126 Z"/>
    <path d="M151 102 L137 80 L141 78 L155 98 Z"/>
    <path d="M169 102 L183 80 L179 78 L165 98 Z"/>
  </g>

  <!-- Stage lip with footlights -->
  <rect x="0" y="134" width="320" height="4" fill="#3a2010"/>
  <g fill="url(#gold)">
    <circle cx="20" cy="136" r="2.2"/><circle cx="50" cy="136" r="2.2"/><circle cx="80" cy="136" r="2.2"/><circle cx="110" cy="136" r="2.2"/>
    <circle cx="140" cy="136" r="2.2"/><circle cx="170" cy="136" r="2.2"/><circle cx="200" cy="136" r="2.2"/><circle cx="230" cy="136" r="2.2"/>
    <circle cx="260" cy="136" r="2.2"/><circle cx="290" cy="136" r="2.2"/>
  </g>

  <!-- Curtains, drawn back with gold ropes -->
  <path d="M0 0 H86 C76 34 66 70 52 96 C46 108 50 126 58 150 C38 148 18 150 0 154 Z" fill="url(#velvetL)"/>
  <path d="M320 0 H234 C244 34 254 70 268 96 C274 108 270 126 262 150 C282 148 302 150 320 154 Z" fill="url(#velvetR)"/>
  <path d="M40 92 Q56 98 64 90" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="92" r="3.4" fill="#ffd25a"/>
  <path d="M280 92 Q264 98 256 90" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="92" r="3.4" fill="#ffd25a"/>

  <!-- Valance: scalloped edge with gold fringe -->
  <path d="M0 0 H320 V16 Q306 28 292 16 Q278 28 264 16 Q250 28 236 16 Q222 28 208 16 Q194 28 180 16 Q166 28 152 16 Q138 28 124 16 Q110 28 96 16 Q82 28 68 16 Q54 28 40 16 Q26 28 12 16 Q6 22 0 18 Z" fill="url(#valance)"/>
  <path d="M0 18 Q6 22 12 16 Q26 28 40 16 Q54 28 68 16 Q82 28 96 16 Q110 28 124 16 Q138 28 152 16 Q166 28 180 16 Q194 28 208 16 Q222 28 236 16 Q250 28 264 16 Q278 28 292 16 Q306 28 320 16" fill="none" stroke="#f4c542" stroke-width="1.6"/>
  <rect x="0" y="0" width="320" height="5" fill="#5c0a24"/>
  <rect x="0" y="5" width="320" height="1.4" fill="#f4c542"/>
</svg>
