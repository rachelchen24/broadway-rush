[project]
name = "broadway-rush"
version = "0.1.0"
description = "Predicts in-person Broadway rush ticket availability."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "tzdata",  # zoneinfo needs it on Windows
    "openpyxl>=3.1",  # hand-labeling sheet
    "anthropic>=1.17",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",  # HTML scrapers (grosses, policies)
    "lxml>=5.0",
]

[project.optional-dependencies]
# Kept out of the main list so the daily snapshot job, which runs "pip install -e .", doesn't download them.
model = [
    "lightgbm>=4.7",
    "numpyro>=0.22",  # brings jax
    "scipy>=1.18",
    "pypdf>=7.1",  # Times Square Alliance monthly reports (scrapers/timessquare.py)
]
presentation = [  # presentation/make_visuals.py and make_deck.py (Expo poster, slides)
    "matplotlib>=3.11",
    "python-pptx>=1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
